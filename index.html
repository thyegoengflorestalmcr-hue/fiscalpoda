                                Responda cada item abaixo. Se <strong>NÃO CONFORME</strong>, o formulário de glosa abrirá automaticamente para esta árvore. Itens sem resposta serão tratados como <strong>CONFORME</strong>.
                            </p>
                        </div>

                        {/* Grupos do Checklist (Leque Retrátil / Accordion) */}
                        <div className="divide-y divide-slate-100">
                            {CHECKLIST_GRUPOS.map(grupo => {
                                const regrasDoGrupo = GLOSA_RULES.filter(r => grupo.ids.includes(r.id));
                                const isOpen = !!openGroups[grupo.grupo];
                                const activeNcInGroup = regrasDoGrupo.filter(r => !!glosasAtivas[r.id]).length;

                                return (
                                    <div key={grupo.grupo} className="border-b border-slate-100 last:border-0">
                                        {/* Header do grupo (Clicável para expandir/recolher) */}
                                        <div 
                                            onClick={() => setOpenGroups(prev => ({ ...prev, [grupo.grupo]: !prev[grupo.grupo] }))}
                                            className={`px-6 py-4 cursor-pointer select-none flex items-center justify-between transition-colors bg-${grupo.cor}-50/70 hover:bg-${grupo.cor}-100/80 border-b border-${grupo.cor}-100`}
                                        >
                                            <div className="flex items-center gap-2.5">
                                                <i className={`${grupo.icone} text-${grupo.cor}-600 text-base`}></i>
                                                <span className={`text-[10px] font-black uppercase tracking-widest text-${grupo.cor}-900`}>
                                                    {grupo.grupo}
                                                </span>
                                                <span className="text-[8px] font-bold text-slate-400">
                                                    ({regrasDoGrupo.length} itens)
                                                </span>
                                                {activeNcInGroup > 0 && (
                                                    <span className="bg-red-500 text-white text-[8px] font-black px-2 py-0.5 rounded-full ml-1 animate-pulse">
                                                        {activeNcInGroup} NC
                                                    </span>
                                                )}
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <span className="text-[8px] font-black text-slate-400 uppercase">
                                                    {isOpen ? "Recolher" : "Expandir"}
                                                </span>
                                                <i className={`fas fa-chevron-down text-slate-400 text-xs transition-transform duration-300 ${isOpen ? 'rotate-180 text-emerald-600' : ''}`}></i>
                                            </div>
                                        </div>

                                        {/* Itens do grupo (Exibidos apenas quando expandido) */}
                                        {isOpen && regrasDoGrupo.map((rule, ruleIdx) => {
                                            const isNaoConforme = !!glosasAtivas[rule.id];
                                            const isConforme = checklistRespostas[rule.id] === 'sim';
                                            const isSevere = parseFloat(rule.glosa) >= 8;
                                            const resposta = checklistRespostas[rule.id]; // 'sim' | 'nao' | undefined

                                            return (
                                                <div key={rule.id} className={`transition-all ${
                                                    isNaoConforme ? 'bg-red-50/60 border-l-4 border-red-500' :
                                                    isConforme ? 'bg-emerald-50/40 border-l-4 border-emerald-400' :
                                                    'border-l-4 border-transparent'
                                                }`}>
                                                    {/* Linha da pergunta */}
                                                    <div className="px-6 py-4">
                                                        {/* Número + Categoria + % glosa */}
                                                        <div className="flex items-start justify-between gap-2 mb-2">
                                                            <div className="flex items-start gap-2 min-w-0">
                                                                <span className="text-[9px] font-black text-slate-400 shrink-0 mt-0.5">#{String(ruleIdx+1).padStart(2,'0')}</span>
                                                                <div className="min-w-0">
                                                                    <p className="text-[10px] font-black text-slate-800 uppercase leading-tight">{rule.cat}</p>
                                                                    <p className="text-[8px] text-slate-500 leading-snug mt-0.5">{rule.desc}</p>
                                                                </div>
                                                            </div>
                                                            <span className={`shrink-0 text-[8px] font-black px-2 py-0.5 rounded-full border ${
                                                                isSevere ? 'bg-red-100 text-red-700 border-red-200' : 'bg-amber-50 text-amber-700 border-amber-200'
                                                            }`}>
                                                                {isSevere ? '⚠️ ' : ''}{rule.glosa}
                                                            </span>
                                                        </div>

                                                        {/* Pergunta do checklist */}
                                                        <p className="text-[10px] font-bold text-slate-700 mb-3 ml-5 leading-snug">
                                                            <i className="fas fa-circle-question text-slate-400 mr-1 text-[8px]"></i>
                                                            {rule.pergunta}
                                                        </p>

                                                        {/* Botões SIM / NÃO */}
                                                        <div className="flex gap-2 ml-5">
                                                            <button type="button"
                                                                onClick={() => responderChecklist(rule.id, 'sim')}
                                                                className={`flex-1 py-2.5 rounded-xl font-black text-[10px] uppercase transition-all border-2 flex items-center justify-center gap-1.5 ${
                                                                    isConforme
                                                                        ? 'bg-emerald-500 text-white border-emerald-600 shadow-md shadow-emerald-200'
                                                                        : 'bg-white text-slate-400 border-slate-200 hover:border-emerald-300 hover:text-emerald-600'
                                                                }`}>
                                                                <i className={`fas fa-check text-[9px] ${isConforme ? 'text-white' : 'text-slate-300'}`}></i>
                                                                CONFORME
                                                            </button>
                                                            <button type="button"
                                                                onClick={() => responderChecklist(rule.id, 'nao')}
                                                                className={`flex-1 py-2.5 rounded-xl font-black text-[10px] uppercase transition-all border-2 flex items-center justify-center gap-1.5 ${
                                                                    isNaoConforme
                                                                        ? 'bg-red-500 text-white border-red-600 shadow-md shadow-red-200'
                                                                        : 'bg-white text-slate-400 border-slate-200 hover:border-red-300 hover:text-red-600'
                                                                }`}>
                                                                <i className={`fas fa-xmark text-[9px] ${isNaoConforme ? 'text-white' : 'text-slate-300'}`}></i>
                                                                NÃO CONFORME
                                            </button>
                                                        </div>

                                                        {/* Subitens de referência (colapsáveis) */}
                                                        {rule.subitens && (
                                                            <details className="ml-5 mt-2">
                                                                <summary className="text-[8px] font-black text-slate-400 uppercase cursor-pointer hover:text-slate-600 transition-colors select-none">
                                                                    <i className="fas fa-list-check mr-1"></i>Ver itens a verificar ({rule.subitens.length})
                                                                </summary>
                                                                <ul className="mt-2 space-y-0.5">
                                                                    {rule.subitens.map((sub, si) => (
                                                                        <li key={si} className="text-[8px] text-slate-500 flex items-start gap-1.5 leading-snug">
                                                                            <i className="fas fa-circle text-[4px] text-slate-300 mt-1.5 shrink-0"></i>
                                                                            {sub}
                                                                        </li>
                                                                    ))}
                                                                </ul>
                                                                <p className="mt-2 text-[7px] text-slate-400 italic leading-snug">
                                                                    <i className="fas fa-scale-balanced mr-1"></i>{rule.howTo}
                                                                </p>
                                                            </details>
                                                        )}
                                                    </div>

                                                    {/* Formulário de Glosa (quando NÃO CONFORME) */}
                                                    {isNaoConforme && (
                                                        <div className="mx-4 mb-4 p-4 border border-red-200 bg-red-50/30 rounded-2xl space-y-4 fade-in">
                                                            <div className="flex items-center gap-2 mb-1">
                                                                <i className="fas fa-triangle-exclamation text-red-500 text-sm"></i>
                                                                <p className="text-[9px] font-black text-red-700 uppercase tracking-wide">
                                                                    Registre a Não Conformidade — Glosa {rule.glosa}
                                                                </p>
                                                            </div>

                                                            {/* Relato */}
                                                            <div className="space-y-1">
                                                                <label className="text-[9px] font-black text-slate-500 uppercase ml-1">Relato da Constatação *</label>
                                                                <textarea value={glosasAtivas[rule.id]?.relato || ''}
                                                                    onChange={e => updateGlosaField(rule.id, 'relato', e.target.value)}
                                                                    placeholder={`Descreva em detalhes a irregularidade observada em relação a: ${rule.cat.toLowerCase()}. Cite o local exato, o trabalhador envolvido e o impacto identificado.`}
                                                                    rows={3}
                                                                    className="w-full p-3 text-xs font-bold uppercase bg-white border border-red-200 outline-none rounded-xl focus:ring-2 focus:ring-red-400/20 placeholder:normal-case placeholder:font-normal placeholder:text-slate-400" />
                                                            </div>

                                                            {/* Fotos da evidência */}
                                                            <div className="space-y-2">
                                                                <label className="block text-[9px] font-black text-slate-500 uppercase ml-1">
                                                                    <i className="fas fa-camera mr-1"></i>Fotos da Evidência (mínimo 1 obrigatório)
                                                                </label>
                                                                <div className="grid grid-cols-3 gap-2">
                                                                    {[0, 1, 2].map(i => {
                                                                        const glosaFoto = glosasAtivas[rule.id]?.fotos?.[i];
                                                                        return (
                                                                            <label key={i} className="relative aspect-square flex flex-col items-center justify-center cursor-pointer overflow-hidden border-2 border-dashed border-red-200 hover:border-red-400 rounded-xl bg-white transition hover:shadow-md group">
                                                                                {glosaFoto ? (
                                                                                    <img src={glosaFoto} className="w-full h-full object-cover" alt=""/>
                                                                                ) : (
                                                                                    <div className="text-center">
                                                                                        <i className="fas fa-camera text-red-300 text-xl mb-0.5 group-hover:text-red-400 transition-colors"></i>
                                                                                        <p className="text-[7px] font-black text-slate-400 uppercase">FOTO {i+1}</p>
                                                                                    </div>
                                                                                )}
                                                                                <input type="file" accept="image/*" multiple className="hidden"
                                                                                    onChange={async e => {
                                                                                        if (e.target.files && e.target.files.length > 0) {
                                                                                            const files = Array.from(e.target.files);
                                                                                            for (let idx = 0; idx < files.length; idx++) {
                                                                                                const targetIdx = i + idx;
                                                                                                if (targetIdx < 3) {
                                                                                                    await processPhoto(files[idx], targetIdx, rule.id);
                                                                                                }
                                                                                            }
                                                                                        }
                                                                                    }}/>
                                                                            </label>
                                                                        );
                                                                    })}
                                                                </div>
                                                            </div>

                                                            {/* Prazo para regularização */}
                                                            <div className="grid grid-cols-2 gap-2">
                                                                <div className="space-y-1">
                                                                    <label className="text-[8px] font-black text-slate-400 uppercase ml-1">Data Limite Regularização</label>
                                                                    <input type="date" value={glosasAtivas[rule.id]?.dataFim || nowDate()}
                                                                        onChange={e => updateGlosaField(rule.id, 'dataFim', e.target.value)}
                                                                        className="w-full p-2.5 text-[10px] font-bold bg-white border border-red-200 outline-none rounded-xl" />
                                                                </div>
                                                                <div className="space-y-1">
                                                                    <label className="text-[8px] font-black text-slate-400 uppercase ml-1">Hora Limite</label>
                                                                    <input type="time" value={glosasAtivas[rule.id]?.horaFim || '18:00'}
                                                                        onChange={e => updateGlosaField(rule.id, 'horaFim', e.target.value)}
                                                                        className="w-full p-2.5 text-[10px] font-bold bg-white border border-red-200 outline-none rounded-xl" />
                                                                </div>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                );
                            })}
                        </div>

                        {/* Resumo das NCs */}
                        {Object.keys(glosasAtivas).length > 0 && (
                            <div className="mx-6 mb-6 p-4 bg-red-900 rounded-2xl">
                                <p className="text-[9px] font-black text-red-300 uppercase mb-2">
                                    <i className="fas fa-gavel mr-1"></i>Glosas que serão aplicadas nesta árvore:
                                </p>
                                {Object.keys(glosasAtivas).map(ruleId => {
                                    const rule = GLOSA_RULES.find(r => r.id === parseInt(ruleId));
                                    return rule ? (
                                        <div key={ruleId} className="flex items-center justify-between py-1 border-b border-red-800 last:border-0">
                                            <span className="text-[9px] font-bold text-white">{rule.cat}</span>
                                            <span className="text-[9px] font-black text-red-300 font-mono">{rule.glosa}</span>
                                        </div>
                                    ) : null;
                                })}
                            </div>
                        )}
                    </div>
                </div>

                {/* 💾 Botão Fixo Salvar */}
                <div className="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-slate-50 via-slate-50/80 to-transparent pointer-events-none z-[100]">
                    <div className="max-w-md mx-auto pointer-events-auto">
                        <button onClick={sendVistoria} disabled={loading}
                            className="w-full py-5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-[2.5rem] font-black text-lg uppercase shadow-2xl shadow-emerald-600/30 btn-active disabled:bg-slate-300 disabled:shadow-none flex items-center justify-center gap-3 border-b-8 border-emerald-800 transition-all">
                            {loading ? <i className="fas fa-circle-notch fa-spin"></i> : <i className="fas fa-check-double"></i>}
                            {loading ? 'SALVANDO VISTORIA...' : 'Salvar Vistoria Técnica'}
                        </button>
                    </div>
                </div>

                {toast && (
                    <div className="fixed top-5 left-1/2 -translate-x-1/2 z-[9999] bg-slate-900/95 backdrop-blur-md text-white border border-emerald-500/30 px-6 py-4 rounded-3xl shadow-2xl flex items-center gap-3 animate-bounce">
                        <i className="fas fa-circle-check text-emerald-400 text-lg"></i>
                        <span className="font-black uppercase text-[10px] tracking-widest">{toast}</span>
                    </div>
                )}
            </div>
        );
    }

    // ── TELA: Sucesso ────────────────────────────────────────────────────
    if (view === 'success') return (
        <div className="min-h-screen bg-emerald-600 flex flex-col items-center justify-center p-8 text-center text-white fade-in">
            <div className="w-28 h-28 bg-white/20 rounded-full flex items-center justify-center mb-8 backdrop-blur-md">
                <div className="w-20 h-20 bg-white rounded-full flex items-center justify-center shadow-2xl">
                    <i className="fas fa-check text-4xl text-emerald-600"></i>
                </div>
            </div>
            <h1 className="text-4xl font-black mb-4 uppercase tracking-tighter italic">{selectedRule?.id===99 ? 'Vistoria de Rotina Salva!' : 'Glosa Registrada!'}</h1>
            <p className="opacity-90 mb-4 font-bold max-w-[240px]">Registro salvo localmente com sucesso.</p>
            <p className="text-[11px] opacity-70 mb-10">Use o <strong>Histórico e Exportação</strong> para gerar o ZIP e enviar para a Daniela.</p>
            <div className="flex flex-col gap-3 w-full max-w-xs">
                <button onClick={()=>{ if (lastSavedEntry) { setPrintMode('individual'); setPrintData(lastSavedEntry); setView('print_preview'); } }}
                    className="w-full bg-slate-950 text-white py-5 font-black uppercase text-sm shadow-2xl rounded-2xl btn-active flex items-center justify-center gap-2">
                    <i className="fas fa-file-pdf"></i> Imprimir Relatório de Vistoria Técnica
                </button>
                <button onClick={()=>{loadHistory();setView('history');}}
                    className="radpoda-card w-full bg-white text-emerald-600 py-5 font-black uppercase text-sm shadow-xl btn-active flex items-center justify-center gap-2">
                    <i className="fas fa-file-zipper"></i> Exportar Agora
                </button>
                <button onClick={()=>{setRelato('');setEndereco('');setFotos([null,null,null]);setSelectedRule(null);setView('rules');}}
                    className="w-full bg-emerald-700 text-white py-4 font-black uppercase text-sm rounded-2xl btn-active flex items-center justify-center gap-2">
                    <i className="fas fa-plus"></i> {selectedRule?.id===99 ? 'Nova Vistoria de Rotina' : 'Nova Glosa'}
                </button>
                <button onClick={()=>{setRelato('');setEndereco('');setFotos([null,null,null]);setSelectedRule(null);setView('fiscal');}}
                    className="text-white/70 font-bold uppercase text-xs py-2">
                    Menu Principal
                </button>
            </div>
        </div>
    );

    if (view === 'print_preview' && printData) {
        if (printMode === 'consolidado') {
            const items = Array.isArray(printData) ? printData : [];
            const conformidades = items.filter(x => x.rule_id === 99);
            const inconformidades = items.filter(x => x.rule_id !== 99);
            const dataMin = items.length > 0 ? new Date(Math.min(...items.map(x => new Date(x.timestamp)))).toLocaleDateString('pt-BR') : '';
            const dataMax = items.length > 0 ? new Date(Math.max(...items.map(x => new Date(x.timestamp)))).toLocaleDateString('pt-BR') : '';
            
            return (
                <div className="bg-white min-h-screen text-slate-900 font-serif">
                    {/* Painel superior de controle - Invisível na impressão */}
                    <div className="no-print bg-slate-950 text-white p-4 sticky top-0 flex justify-between items-center shadow-lg z-[9999] border-b-4 border-emerald-500">
                        <button onClick={() => { setView('history'); }} 
                                className="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-black uppercase flex items-center gap-2 border border-slate-700 active:scale-95 transition-all">
                            <i className="fas fa-arrow-left"></i> Voltar ao Histórico
                        </button>
                        <span className="text-[10px] font-black uppercase tracking-widest text-emerald-400">Relatório de Fiscalização Técnica Consolidado</span>
                        <button onClick={() => window.print()} 
                                className="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-xl text-xs font-black uppercase flex items-center gap-2 border border-emerald-500 active:scale-95 transition-all shadow-md">
                            <i className="fas fa-print"></i> Imprimir Relatório
                        </button>
                    </div>

                    {/* Área da Folha A4 */}
                    <div id="printArea" className="max-w-4xl mx-auto p-8 bg-white my-4 text-left" style={{ minHeight: '297mm' }}>
                        {/* Cabeçalho do Município */}
                        <div className="flex items-center gap-6 border-b-4 border-[#0f4526] pb-6 mb-8">
                            <img src="BRASÃO.jpg" className="w-20 h-20 object-contain" alt="Brasão" />
                            <div className="flex-1 text-left">
                                <h2 className="text-xl font-black tracking-tight text-[#0f4526] uppercase">Prefeitura Municipal de Marechal Cândido Rondon</h2>
                                <p className="text-xs font-bold text-slate-500 uppercase tracking-wider">Secretaria Municipal de Agricultura, Pecuária e Meio Ambiente</p>
                                <p className="text-[9px] text-slate-400 font-bold uppercase tracking-widest mt-1">Departamento de Arborização Urbana e Manejo Florestal</p>
                            </div>
                        </div>

                        {/* Título do Documento */}
                        <div className="text-center mb-8">
                            <h1 className="text-xl font-black text-slate-900 uppercase tracking-tight border-y-2 border-slate-300 py-3">
                                Relatório de Fiscalização Técnica
                            </h1>
                            <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest mt-2">
                                Controle de Vistorias e Irregularidades de Campo • Período: {dataMin} a {dataMax}
                            </p>
                        </div>

                        {/* Identificação Geral */}
                        <div className="grid grid-cols-2 gap-4 text-xs mb-8 border-b border-slate-100 pb-4">
                            <div>
                                <span className="font-bold text-slate-500 uppercase text-[9px] block">Fiscal Responsável:</span>
                                <span className="font-bold text-slate-800 uppercase">{fiscal}</span>
                            </div>
                            <div>
                                <span className="font-bold text-slate-500 uppercase text-[9px] block">Total de Atividades Auditadas:</span>
                                <span className="font-bold text-slate-800">{items.length} registro(s) no total</span>
                            </div>
                        </div>

                        {/* Seção 1: Amostragem de Árvores Vistoriadas */}
                        <div className="mb-8">
                            <h3 className="font-black text-sm uppercase text-[#0f4526] border-b-2 border-slate-200 pb-2 mb-4">1. Amostragem de Árvores Vistoriadas (Executadas)</h3>
                            {conformidades.length === 0 ? (
                                <p className="text-xs text-slate-500 italic">Nenhuma vistoria de rotina registrada no período.</p>
                            ) : (
                                <table className="w-full text-xs text-left border-collapse border border-slate-200 mb-6">
                                    <thead>
                                        <tr className="bg-slate-50">
                                            <th className="border border-slate-200 p-2 font-bold uppercase text-[9px] text-slate-600">Amostra</th>
                                            <th className="border border-slate-200 p-2 font-bold uppercase text-[9px] text-slate-600">Data/Hora</th>
                                            <th className="border border-slate-200 p-2 font-bold uppercase text-[9px] text-slate-600">Espécie</th>
                                            <th className="border border-slate-200 p-2 font-bold uppercase text-[9px] text-slate-600">CAP</th>
                                            <th className="border border-slate-200 p-2 font-bold uppercase text-[9px] text-slate-600">Altura</th>
                                            <th className="border border-slate-200 p-2 font-bold uppercase text-[9px] text-slate-600">Localização</th>
                                            <th className="border border-slate-200 p-2 font-bold uppercase text-[9px] text-slate-600 text-center">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {conformidades.map((x, idx) => (
                                            <tr key={idx} className="hover:bg-slate-50/50">
                                                <td className="border border-slate-200 p-2 font-mono font-bold">{x.amostra_indice}/{x.amostra_total}</td>
                                                <td className="border border-slate-200 p-2">{new Date(x.timestamp).toLocaleString('pt-BR').slice(0,16)}</td>
                                                <td className="border border-slate-200 p-2 font-bold uppercase">{x.dendro_especie || 'N/D'}</td>
                                                <td className="border border-slate-200 p-2 font-mono">Classe {x.dendro_cap_cm ? `(${x.dendro_cap_cm} cm)` : 'N/D'}</td>
                                                <td className="border border-slate-200 p-2 font-mono">Classe {x.dendro_altura_m ? `(${x.dendro_altura_m} m)` : 'N/D'}</td>
                                                <td className="border border-slate-200 p-2 uppercase text-[10px] leading-tight" title={x.endereco}>{x.endereco}</td>
                                                <td className="border border-slate-200 p-2 text-center">
                                                    <span className="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded text-[9px] font-black uppercase">EXECUTADA</span>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            )}
                        </div>

                        {/* Seção 2: Irregularidades e Ocorrências (Glosas) */}
                        <div className="mb-8">
                            <h3 className="font-black text-sm uppercase text-[#0f4526] border-b-2 border-slate-200 pb-2 mb-4">2. Irregularidades Licitatórias Identificadas (Glosas)</h3>
                            {inconformidades.length === 0 ? (
                                <p className="text-xs text-slate-500 italic">Nenhuma inconformidade de execução registrada no período.</p>
                            ) : (
                                <table className="w-full text-xs text-left border-collapse border border-slate-200 mb-6">
                                    <thead>
                                        <tr className="bg-slate-50">
                                            <th className="border border-slate-200 p-2 font-bold uppercase text-[9px] text-slate-600">Item</th>
                                            <th className="border border-slate-200 p-2 font-bold uppercase text-[9px] text-slate-600">Regra Violada</th>
                                            <th className="border border-slate-200 p-2 font-bold uppercase text-[9px] text-slate-600">Data/Hora</th>
                                            <th className="border border-slate-200 p-2 font-bold uppercase text-[9px] text-slate-600">Localização</th>
                                            <th className="border border-slate-200 p-2 font-bold uppercase text-[9px] text-slate-600">Constatação / Parecer</th>
                                            <th className="border border-slate-200 p-2 font-bold uppercase text-[9px] text-slate-600 text-center">Glosa</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {inconformidades.map((x, idx) => {
                                            const rule = GLOSA_RULES.find(r => r.id === x.rule_id) || {};
                                            return (
                                                <tr key={idx} className="hover:bg-slate-50/50">
                                                    <td className="border border-slate-200 p-2 font-bold font-mono">Regra {x.rule_id}</td>
                                                    <td className="border border-slate-200 p-2 uppercase font-bold text-[10px]">{x.categoria}</td>
                                                    <td className="border border-slate-200 p-2">{new Date(x.timestamp).toLocaleString('pt-BR').slice(0,16)}</td>
                                                    <td className="border border-slate-200 p-2 uppercase text-[10px] leading-tight" title={x.endereco}>{x.endereco}</td>
                                                    <td className="border border-slate-200 p-2 text-justify text-[10px] leading-relaxed max-w-[280px] whitespace-pre-wrap">{x.observacao}</td>
                                                    <td className="border border-slate-200 p-2 text-center">
                                                        <span className="bg-red-100 text-red-800 px-2 py-0.5 rounded text-[9px] font-black uppercase font-mono">{rule.glosa || '0.00%'}</span>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            )}
                        </div>

                        {/* Seção 3: Anexo Fotográfico de Campo */}
                        <div className="page-break mb-8">
                            <h3 className="font-black text-sm uppercase text-[#0f4526] border-b-2 border-slate-200 pb-2 mb-6">3. Anexo Fotográfico de Campo</h3>
                            <div className="space-y-8">
                                {items.map((x, idx) => {
                                    if (!x.fotosBase64 || x.fotosBase64.length === 0) return null;
                                    const isConf = x.rule_id === 99;
                                    return (
                                        <div key={idx} className="border border-slate-200 p-6 rounded-3xl bg-slate-50/30 space-y-4 page-break-avoid">
                                            <div className="flex justify-between items-center border-b border-slate-100 pb-2">
                                                <span className="text-[10px] font-black text-slate-500 uppercase tracking-widest">
                                                    Registro #{idx + 1} — {isConf ? `Vistoria de Rotina (Amostra ${x.amostra_indice}/${x.amostra_total})` : `Ocorrência de Glosa (Regra ${x.rule_id})`}
                                                </span>
                                                <span className="text-[9px] font-bold text-slate-400 font-mono">
                                                    {new Date(x.timestamp).toLocaleString('pt-BR')}
                                                </span>
                                            </div>
                                            <div className="flex flex-col gap-6">
                                                {x.fotosBase64.map((b64, fIdx) => (
                                                    <div key={fIdx} className="flex flex-col items-center border border-slate-200 p-3 rounded-2xl bg-white shadow-sm page-break-avoid">
                                                        <img src={b64} className="h-[24rem] w-full object-contain rounded-xl border bg-slate-950 shadow-inner" alt="Evidência" />
                                                        <span className="text-[9px] text-slate-500 font-bold uppercase tracking-widest mt-2">
                                                            Evidência {fIdx + 1} — Logradouro: {x.endereco} | GPS: {x.gps || 'N/D'}
                                                        </span>
                                                    </div>
                                                ))}
                                            </div>
                                            <div className="text-xs text-slate-700 bg-white p-4 rounded-xl border border-slate-200 leading-relaxed text-justify">
                                                <strong>Descrição Técnica / Parecer de Campo:</strong> {isConf ? `Serviço de manejo de arborização vistoriado e constatado como EXECUTADO. Dados dendrométricos da amostra: Espécie: ${x.dendro_especie || 'N/I'} | CAP: Classe (Ref. ${x.dendro_cap_cm || 'N/I'} cm) | Altura: Classe (Ref. ${x.dendro_altura_m || 'N/I'} m)` : x.observacao}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Assinatura no Rodapé */}
                        <div className="mt-20 flex flex-col items-center page-break-avoid">
                            <div className="border-t border-slate-400 w-80 text-center pt-3">
                                <p className="font-bold text-sm text-slate-800">Daniela Fernanda Dewes de Freitas</p>
                                <p className="text-[10px] text-slate-500 uppercase tracking-widest mt-0.5">Fiscal Técnico de Arborização Urbana</p>
                                <p className="text-[9px] text-slate-400 uppercase tracking-wider">Secretaria Municipal de Meio Ambiente • Marechal Cândido Rondon - PR</p>
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        // MODO INDIVIDUAL: Relatório de Vistoria Técnica Unificado (Rotina + Glosas do Local)
        const rotina = printData.rotina || printData;
        const glosas = printData.glosas || [];
        
        return (
            <div className="bg-white min-h-screen text-slate-900 font-serif">
                {/* Painel superior de controle - Invisível na impressão */}
                <div className="no-print bg-slate-950 text-white p-4 sticky top-0 flex justify-between items-center shadow-lg z-[9999] border-b-4 border-emerald-500">
                    <button onClick={() => { setView('history'); }} 
                            className="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-black uppercase flex items-center gap-2 border border-slate-700 active:scale-95 transition-all">
                        <i className="fas fa-arrow-left"></i> Voltar ao Histórico
                    </button>
                    <span className="text-[10px] font-black uppercase tracking-widest text-emerald-400">Pré-Visualização do Laudo Técnico Único</span>
                    <button onClick={() => window.print()} 
                            className="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-xl text-xs font-black uppercase flex items-center gap-2 border border-emerald-500 active:scale-95 transition-all shadow-md">
                        <i className="fas fa-print"></i> Imprimir Laudo
                    </button>
                </div>

                {/* Área da Folha A4 */}
                <div id="printArea" className="max-w-3xl mx-auto p-8 bg-white border border-slate-200 my-8 shadow-inner" style={{ minHeight: '297mm' }}>
                    
                    {/* Cabeçalho do Município */}
                    <div className="flex items-center gap-6 border-b-4 border-[#0f4526] pb-6 mb-8">
                        <img src="BRASÃO.jpg" className="w-20 h-20 object-contain" alt="Brasão" />
                        <div className="flex-1 text-left">
                            <h2 className="text-xl font-black tracking-tight text-[#0f4526] uppercase">Prefeitura Municipal de Marechal Cândido Rondon</h2>
                            <p className="text-xs font-bold text-slate-500 uppercase tracking-wider">Secretaria Municipal de Agricultura, Pecuária e Meio Ambiente</p>
                            <p className="text-[9px] text-slate-400 font-bold uppercase tracking-widest mt-1">Departamento de Arborização Urbana e Manejo Florestal</p>
                        </div>
                    </div>

                    {/* Título do Documento */}
                    <div className="text-center mb-8">
                        <h1 className="text-lg font-black text-slate-900 uppercase tracking-tight border-y-2 border-slate-300 py-3">
                            Relatório de Vistoria Técnica
                        </h1>
                        <p className="text-[9px] font-bold text-slate-500 uppercase tracking-widest mt-2">
                            Módulo de Fiscalização e Controle de Arborização Urbana • Pregão nº 71-2025
                        </p>
                    </div>

                    {/* Dados Básicos da Fiscalização */}
                    <div className="grid grid-cols-2 gap-y-3 gap-x-6 text-xs text-left mb-8 border-b border-slate-100 pb-6">
                        <div>
                            <span className="font-bold text-slate-500 uppercase text-[9px] block">Fiscal Responsável:</span>
                            <span className="font-bold text-slate-800 uppercase">{rotina.fiscal}</span>
                        </div>
                        <div>
                            <span className="font-bold text-slate-500 uppercase text-[9px] block">Data e Hora do Registro:</span>
                            <span className="font-bold text-slate-800">{new Date(rotina.timestamp).toLocaleString('pt-BR')}</span>
                        </div>
                        <div className="col-span-2">
                            <span className="font-bold text-slate-500 uppercase text-[9px] block">Localização / Logradouro Auditado:</span>
                            <span className="font-bold text-slate-800 uppercase">{rotina.endereco}</span>
                        </div>
                        <div className="col-span-2">
                            <span className="font-bold text-slate-500 uppercase text-[9px] block">Coordenadas Georreferenciadas (GPS):</span>
                            <span className="font-bold text-slate-800 font-mono">{rotina.gps || 'N/A'}</span>
                        </div>
                    </div>

                    {/* 1. Amostragem de Rotina (Biometria) */}
                    <div className="bg-slate-50 border border-slate-200 p-6 rounded-2xl mb-8 text-left">
                        <div className="flex justify-between items-center border-b border-slate-200 pb-3 mb-4">
                            <span className="font-black text-xs uppercase text-slate-700">1. Constatação da Amostragem de Rotina</span>
                            <span className="status-badge bg-emerald-700 text-white text-[9px]">
                                AMOSTRA {rotina.amostra_indice || 'N/D'}/{rotina.amostra_total || '10'}
                            </span>
                        </div>
                        <div className="grid grid-cols-3 gap-4 text-xs">
                            <div>
                                <span className="font-bold text-slate-500 uppercase text-[8px] block">Espécie Identificada:</span>
                                <span className="font-bold text-slate-800 uppercase">{rotina.dendro_especie || 'N/I'}</span>
                            </div>
                            <div>
                                <span className="font-bold text-slate-500 uppercase text-[8px] block">Circunferência (CAP):</span>
                                <span className="font-bold text-slate-800 uppercase">{rotina.dendro_cap_cm ? `Classe (Ref: ${rotina.dendro_cap_cm} cm)` : 'N/I'}</span>
                            </div>
                            <div>
                                <span className="font-bold text-slate-500 uppercase text-[8px] block">Altura Estimada:</span>
                                <span className="font-bold text-slate-800 uppercase">{rotina.dendro_altura_m ? `Classe (Ref: ${rotina.dendro_altura_m} m)` : 'N/I'}</span>
                            </div>
                        </div>
                        <p className="text-xs text-slate-700 mt-4 leading-relaxed text-justify border-t border-slate-200/60 pt-3">
                            <strong>PARECER TÉCNICO DE ROTINA:</strong> Vistoria in loco constatou que os serviços de manejo programados no logradouro especificado foram devidamente <strong>EXECUTADOS</strong> em conformidade com as diretrizes técnicas do edital de Pregão nº 71-2025.
                        </p>
                    </div>

                    {/* 2. Irregularidades Contratuais e de Campo */}
                    <div className="mb-8 text-left">
                        <h3 className="font-black text-xs uppercase text-slate-700 border-b border-slate-200 pb-2 mb-4">2. Ocorrências e Irregularidades Constatadas no Local</h3>
                        {glosas.length === 0 ? (
                            <p className="text-xs text-slate-500 leading-relaxed italic bg-slate-50 p-4 border rounded-xl">
                                ✅ Não foram constatadas irregularidades licitatórias, falhas na sinalização ou ausência de EPIs por parte da equipe de execução neste endereço durante a vistoria técnica.
                            </p>
                        ) : (
                            <div className="space-y-4">
                                {glosas.map((glosa, gIdx) => {
                                    const rule = GLOSA_RULES.find(r => r.id === glosa.rule_id) || {};
                                    return (
                                        <div key={glosa.rule_id} className="border border-red-100 rounded-2xl p-4 bg-red-50/10 space-y-3 page-break-avoid">
                                            <div className="flex justify-between items-center border-b border-red-100 pb-2">
                                                <span className="font-black text-[10px] text-red-700 uppercase">
                                                    Irregularidade #{gIdx + 1}: {glosa.categoria} (Regra {glosa.rule_id})
                                                </span>
                                                <span className="status-badge bg-red-100 text-red-800 text-[8px] font-mono shrink-0">
                                                    GLOSA: {rule.glosa || '0.00%'}
                                                </span>
                                            </div>
                                            <p className="text-xs text-slate-800 leading-relaxed font-mono uppercase bg-white p-3 border rounded-xl shadow-inner">
                                                {glosa.observacao}
                                            </p>
                                            {glosa.periodo_fim && (
                                                <p className="text-[9px] text-red-600 font-bold">
                                                    ⏱️ Prazo limite para regularização determinado: {new Date(glosa.periodo_fim).toLocaleString('pt-BR')}
                                                </p>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>

                    {/* 3. Anexo Fotográfico Único */}
                    <div className="page-break mb-8 text-left">
                        <h3 className="font-black text-xs uppercase text-slate-700 border-b border-slate-200 pb-2 mb-6">3. Anexo Fotográfico Georreferenciado</h3>
                        
                        <div className="space-y-8">
                            {/* Fotos da Rotina */}
                            {rotina.fotosBase64 && rotina.fotosBase64.length > 0 && (
                                <div className="space-y-4">
                                    <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Fotos de Campo (Árvore Amostrada)</h4>
                                    <div className="flex flex-col gap-6">
                                        {rotina.fotosBase64.map((b64, idx) => (
                                            <div key={idx} className="border border-slate-200 p-3 rounded-2xl bg-slate-50/50 flex flex-col items-center page-break-avoid">
                                                <img src={b64} className="h-[24rem] w-full object-contain rounded-xl shadow-md border bg-slate-950 shadow-inner" alt="Evidência Rotina" />
                                                <span className="text-[9px] text-slate-500 font-bold uppercase tracking-widest mt-2">
                                                    Evidência {idx + 1} — Vistoria de Rotina | GPS: {rotina.gps || 'N/D'}
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* Fotos de cada Glosa */}
                            {glosas.map((glosa, gIdx) => {
                                if (!glosa.fotosBase64 || glosa.fotosBase64.length === 0) return null;
                                return (
                                    <div key={glosa.rule_id} className="space-y-4 pt-6 border-t border-slate-100 page-break">
                                        <h4 className="text-[10px] font-black text-red-600 uppercase tracking-widest">Fotos de Evidência: {glosa.categoria}</h4>
                                        <div className="flex flex-col gap-6">
                                            {glosa.fotosBase64.map((b64, fIdx) => (
                                                <div key={fIdx} className="border border-red-100/60 p-3 rounded-2xl bg-red-50/5 flex flex-col items-center page-break-avoid">
                                                    <img src={b64} className="h-[24rem] w-full object-contain rounded-xl shadow-md border bg-slate-950 shadow-inner" alt="Evidência Glosa" />
                                                    <span className="text-[9px] text-red-700 font-bold uppercase tracking-widest mt-2">
                                                        Evidência {fIdx + 1} — {glosa.categoria} | GPS: {glosa.gps || 'N/D'}
                                                    </span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* Assinatura no Rodapé */}
                    <div className="mt-20 flex flex-col items-center page-break-avoid">
                        <div className="border-t border-slate-400 w-80 text-center pt-3">
                            <p className="font-bold text-sm text-slate-800">Daniela Fernanda Dewes de Freitas</p>
                            <p className="text-[10px] text-slate-500 uppercase tracking-widest mt-0.5">Fiscal Técnico de Arborização Urbana</p>
                            <p className="text-[9px] text-slate-400 uppercase tracking-wider">Secretaria Municipal de Meio Ambiente • Marechal Cândido Rondon - PR</p>
                        </div>
                    </div>

                </div>
            </div>
        );
    }

    return null;
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
