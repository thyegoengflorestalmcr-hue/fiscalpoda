name: Arbor Intel · Build Android Test Harness

on:
  push:
    branches: ['ci/arbor-intel-testlab-bridge']
    paths:
      - 'qa-testlab/**'
      - '.github/workflows/arbor-intel-build-apk.yml'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Arbor Intel QA URL loaded by the WebView wrapper'
        required: false
        default: 'https://arbor-intel-hd6kik255-thyegos-projects.vercel.app/app.html?_vercel_share=LVQeRYVCLexOSOktHSYQf2uVA24XcRWJ'

permissions:
  contents: write

env:
  TARGET_URL: ${{ inputs.target_url || 'https://arbor-intel-hd6kik255-thyegos-projects.vercel.app/app.html?_vercel_share=LVQeRYVCLexOSOktHSYQf2uVA24XcRWJ' }}
  QA_APP_SHA: ba3035ecf9de9a33262b9c6e43d474e61ae52084

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify exact QA target URL
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 10 -c /tmp/vercel.cookies -b /tmp/vercel.cookies "$TARGET_URL" -o /tmp/arbor-target.html
          grep -qi 'Arbor Intel' /tmp/arbor-target.html
          printf 'TARGET_URL=%s\nQA_APP_SHA=%s\nSOURCE_BRIDGE_SHA=%s\n' "$TARGET_URL" "$QA_APP_SHA" "$GITHUB_SHA" | tee harness-identity.txt

      - name: Create isolated Capacitor Android wrapper
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .arbor-testlab-wrapper
          mkdir -p .arbor-testlab-wrapper/www
          cat > .arbor-testlab-wrapper/package.json <<'JSON'
          {"private":true,"dependencies":{"@capacitor/core":"7.4.3","@capacitor/cli":"7.4.3","@capacitor/android":"7.4.3"}}
          JSON
          printf '<!doctype html><html><body>Arbor Intel Test Lab wrapper</body></html>' > .arbor-testlab-wrapper/www/index.html
          cat > .arbor-testlab-wrapper/capacitor.config.json <<JSON
          {
            "appId":"br.com.arborintel.testlab",
            "appName":"Arbor Intel Test Lab",
            "webDir":"www",
            "server":{"url":"${TARGET_URL}","androidScheme":"https","cleartext":false}
          }
          JSON
          cd .arbor-testlab-wrapper
          npm install --no-audit --no-fund
          npx cap add android

      - name: Add permissions and Espresso-Web instrumentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path('.arbor-testlab-wrapper/android/app/src/main/AndroidManifest.xml')
          s=manifest.read_text()
          additions=[]
          for permission in [
              'android.permission.CAMERA',
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.ACCESS_COARSE_LOCATION',
          ]:
              if permission not in s:
                  additions.append(f'    <uses-permission android:name="{permission}" />')
          if additions:
              s=s.replace('<application','\n'.join(additions)+'\n\n    <application',1)
          manifest.write_text(s)

          gradle=Path('.arbor-testlab-wrapper/android/app/build.gradle')
          g=gradle.read_text()
          if 'androidx.test.espresso:espresso-web' not in g:
              g += '''\n\ndependencies {\n    androidTestImplementation 'androidx.test.ext:junit:1.2.1'\n    androidTestImplementation 'androidx.test:rules:1.6.1'\n    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'\n    androidTestImplementation 'androidx.test.espresso:espresso-web:3.6.1'\n}\n'''
          if 'testInstrumentationRunner' not in g:
              g=g.replace('defaultConfig {','defaultConfig {\n        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"',1)
          gradle.write_text(g)
          PY
          mkdir -p .arbor-testlab-wrapper/android/app/src/androidTest/java/br/com/arborintel/testlab
          cp qa-testlab/*.java .arbor-testlab-wrapper/android/app/src/androidTest/java/br/com/arborintel/testlab/

      - name: Build app and instrumentation APKs
        shell: bash
        run: |
          set -euo pipefail
          cd .arbor-testlab-wrapper/android
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
          cd ../..
          APP_APK=$(find .arbor-testlab-wrapper/android/app/build/outputs/apk/debug -name '*-debug.apk' ! -name '*androidTest*' | head -n1)
          TEST_APK=$(find .arbor-testlab-wrapper/android/app/build/outputs/apk/androidTest -name '*.apk' | head -n1)
          test -f "$APP_APK"
          test -f "$TEST_APK"
          cp "$APP_APK" arbor-intel-testlab-app.apk
          cp "$TEST_APK" arbor-intel-testlab-androidTest.apk
          sha256sum arbor-intel-testlab-*.apk | tee apk-sha256.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arbor-intel-testlab-qa-${{ env.QA_APP_SHA }}-${{ github.sha }}
          path: |
            arbor-intel-testlab-app.apk
            arbor-intel-testlab-androidTest.apk
            apk-sha256.txt
            harness-identity.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish temporary public pre-release for Cloud Shell
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='arbor-intel-testlab-bridge'
          gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$TAG" \
            arbor-intel-testlab-app.apk \
            arbor-intel-testlab-androidTest.apk \
            apk-sha256.txt \
            harness-identity.txt \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title 'TEMPORARY · Arbor Intel Firebase Test Lab Harness' \
            --notes "Temporary QA bridge for ARBOR INTEL SHA ${QA_APP_SHA}. Contains only Android test harness artifacts; no private ARBOR INTEL source or credentials."
