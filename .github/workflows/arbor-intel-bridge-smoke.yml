name: Arbor Intel · Public QA Bridge

on:
  push:
    branches: ['ci/arbor-intel-testlab-bridge']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove public runner allocation
        run: |
          echo "PUBLIC_RUNNER_OK"
          uname -a
          node --version
          java -version

  web_qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ARBOR_BASE_URL: https://arbor-intel.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install black-box QA dependencies
        working-directory: qa-web
        run: npm install --no-audit --no-fund

      - name: Install browser engines
        working-directory: qa-web
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright whole-app diagnostics
        id: playwright
        working-directory: qa-web
        shell: bash
        run: |
          set +e
          npx playwright test
          CODE=$?
          echo "PLAYWRIGHT_EXIT=$CODE" >> "$GITHUB_ENV"
          echo "Playwright exit=$CODE"
          exit 0

      - name: Run Lighthouse diagnostics
        id: lighthouse
        working-directory: qa-web
        shell: bash
        run: |
          set +e
          npm run lighthouse
          CODE=$?
          echo "LIGHTHOUSE_EXIT=$CODE" >> "$GITHUB_ENV"
          echo "Lighthouse exit=$CODE"
          exit 0

      - name: Upload browser QA evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arbor-intel-web-qa-${{ github.sha }}
          path: |
            qa-web/playwright-report
            qa-web/test-results
            qa-web/lighthouse-results
          if-no-files-found: warn
          retention-days: 14

      - name: QA verdict
        if: always()
        shell: bash
        run: |
          echo "Playwright=${PLAYWRIGHT_EXIT:-99} Lighthouse=${LIGHTHOUSE_EXIT:-99}"
          test "${PLAYWRIGHT_EXIT:-99}" -eq 0
          test "${LIGHTHOUSE_EXIT:-99}" -eq 0
